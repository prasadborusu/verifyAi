[build]
  # Netlify publishes the static frontend directory containing index.html and config.js
  publish = "frontend"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify reverse proxy to deployed Render backend
[[redirects]]
  from = "/health"
  to = "https://verifyai-yea7.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/analyze"
  to = "https://verifyai-yea7.onrender.com/analyze"
  status = 200
  force = true

[[redirects]]
  from = "/documents/*"
  to = "https://verifyai-yea7.onrender.com/documents/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tasks/*"
  to = "https://verifyai-yea7.onrender.com/tasks/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/evaluation/*"
  to = "https://verifyai-yea7.onrender.com/evaluation/:splat"
  status = 200
  force = true

# SPA Fallback: Route all unmatched paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
