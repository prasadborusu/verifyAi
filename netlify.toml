[build]
  # Netlify publishes the static frontend directory containing index.html and config.js
  publish = "frontend"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# SPA Fallback: Route all unmatched paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

